<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Power Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        label {
            font-size: 1.2em;
            color: #34495e;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            border: none;
            color: white;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        .result {
            margin-top: 20px;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            font-size: 1.5em;
            color: #2980b9;
        }

        .error {
            color: red;
            font-size: 0.9em;
            text-align: center;
        }

        @media (max-width: 600px) {
            form {
                padding: 10px;
            }

            label {
                font-size: 1em;
            }

            button {
                font-size: 1em;
            }
        }
    </style>
</head>

<body>

    <h1>Predict Solar Power Output</h1>
    <form id="predictionForm" method="POST" action="/predict">
        <label for="temperature">Temperature (°C):</label>
        <input type="number" step="0.01" id="temperature" name="temperature" value="{{ request.form.temperature }}" required>
    
        <label for="humidity">Humidity (%):</label>
        <input type="number" step="0.01" id="humidity" name="humidity" value="{{ request.form.humidity }}" required>
    
        <label for="irradiation">Irradiation (W/m²):</label>
        <input type="number" step="0.01" id="irradiation" name="irradiation" value="{{ request.form.irradiation }}" required>
    
        <label for="time">Time of Day (HH:MM, 24-hour format):</label>
        <input type="text" id="time" name="time" placeholder="14:30" value="{{ request.form.time }}" pattern="^([01][0-9]|2[0-3]):([0-5][0-9])$" required>
    
        <div class="error" id="timeError"></div>
    
        <button type="submit">Predict Power</button>
    </form>

    <div class="loading" id="loading">Predicting...</div>

    {% if prediction %}
    <div class="result">
        <h2>Predicted AC Power: {{ prediction }} kW</h2>
    </div>
    {% endif %}

    <script>
        const form = document.getElementById('predictionForm');
        const timeInput = document.getElementById('time');
        const timeError = document.getElementById('timeError');

        form.addEventListener('submit', function (event) {
            const timeValue = timeInput.value;

            // Check if the time value matches the 24-hour HH:MM format
            const timePattern = /^([01][0-9]|2[0-3]):([0-5][0-9])$/;
            if (!timePattern.test(timeValue)) {
                event.preventDefault(); // Stop form submission
                timeError.textContent = "Please enter a valid time in 24-hour format (HH:MM).";
            } else {
                document.getElementById('loading').style.display = 'block';
                timeError.textContent = ""; // Clear the error message
            }
        });
    </script>

</body>
</html>
